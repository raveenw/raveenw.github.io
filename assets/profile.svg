<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f5f7fa" rx="20" ry="20"/>
  
  <!-- Cloud Infrastructure Illustration -->
  <g transform="translate(50, 50)">
    <!-- Cloud Shape -->
    <path d="M250,100 C250,77.91 232.09,60 210,60 C206.65,60 203.4,60.41 200.31,61.17 C189.98,39.04 168.26,24 143,24 C111.97,24 86.61,48.44 85.09,79.18 C67.24,84.9 54,101.44 54,121 C54,145.3 73.7,165 98,165 L242,165 C255.25,165 266,154.25 266,141 C266,127.75 255.25,117 242,117 C241.34,117 240.68,117.03 240.03,117.09 C246.95,112.27 251.96,104.61 253.54,95.77 C252.08,97.86 250.34,99.76 248.38,101.38 C249.44,98.26 250,94.96 250,91.54 C250,78.13 241.87,66.65 230,61.46 C243.69,67.34 253.59,82.15 253.59,99.59 C251.38,99.86 249.22,100 247.12,100 C248.1,100 249.06,100.01 250,100 Z" fill="#0066cc" opacity="0.2"/>
    
    <!-- Server Racks -->
    <g transform="translate(80, 130)">
      <!-- Rack 1 -->
      <rect x="0" y="0" width="40" height="80" rx="2" ry="2" fill="#183153"/>
      <rect x="5" y="5" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="5" y="20" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="5" y="35" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="5" y="50" width="30" height="10" rx="1" ry="1" fill="#00bcd4"/>
      <rect x="5" y="65" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      
      <!-- Rack 2 -->
      <rect x="60" y="0" width="40" height="80" rx="2" ry="2" fill="#183153"/>
      <rect x="65" y="5" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="65" y="20" width="30" height="10" rx="1" ry="1" fill="#00bcd4"/>
      <rect x="65" y="35" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="65" y="50" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="65" y="65" width="30" height="10" rx="1" ry="1" fill="#00bcd4"/>
      
      <!-- Rack 3 -->
      <rect x="120" y="0" width="40" height="80" rx="2" ry="2" fill="#183153"/>
      <rect x="125" y="5" width="30" height="10" rx="1" ry="1" fill="#00bcd4"/>
      <rect x="125" y="20" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="125" y="35" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
      <rect x="125" y="50" width="30" height="10" rx="1" ry="1" fill="#00bcd4"/>
      <rect x="125" y="65" width="30" height="10" rx="1" ry="1" fill="#4d94ff"/>
    </g>
    
    <!-- Connection Lines -->
    <g stroke="#183153" stroke-width="2" stroke-dasharray="5,5">
      <line x1="100" y1="130" x2="100" y2="100" />
      <line x1="160" y1="130" x2="160" y2="100" />
      <line x1="220" y1="130" x2="220" y2="100" />
      <line x1="100" y1="100" x2="220" y2="100" />
    </g>
    
    <!-- Icons -->
    <g transform="translate(70, 40)">
      <!-- DevOps Symbol -->
      <circle cx="40" cy="20" r="15" fill="#28a745" opacity="0.7"/>
      <text x="40" y="25" font-family="Arial" font-weight="bold" font-size="14" fill="#183153" text-anchor="middle">∞</text>
      
      <!-- Cloud Symbol -->
      <circle cx="100" cy="20" r="15" fill="#0066cc" opacity="0.7"/>
      <text x="100" y="25" font-family="Arial" font-weight="bold" font-size="16" fill="#183153" text-anchor="middle">☁</text>
      
      <!-- Security Symbol -->
      <circle cx="160" cy="20" r="15" fill="#00bcd4" opacity="0.7"/>
      <text x="160" y="25" font-family="Arial" font-weight="bold" font-size="16" fill="#183153" text-anchor="middle">🔒</text>
    </g>
  </g>
  
  <!-- Text at the bottom -->
  <text x="200" y="350" font-family="Arial" font-weight="bold" font-size="16" fill="#0066cc" text-anchor="middle">Reliable • Scalable • Secure</text>
  <text x="200" y="375" font-family="Arial" font-size="14" fill="#183153" text-anchor="middle">Cloud Infrastructure</text>
</svg>
